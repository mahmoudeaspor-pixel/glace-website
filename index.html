:root{--bg:#fbf8f2;--ink:#17130f;--gold:#c99620;--line:#e9ddc4}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;min-height:100vh;padding:32px 18px 54px}.page{width:min(100%,720px);margin:auto}.logo{text-align:center;margin:8px auto 36px}.logo img{display:block;width:min(100%,590px);height:auto;margin:auto}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{min-width:0;min-height:118px;display:flex;align-items:center;gap:15px;padding:20px 18px;border:1px solid var(--line);border-radius:20px;background:#fff;text-decoration:none;color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s}.tile:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 30px #8e6d251a}.symbol{display:grid;place-items:center;flex:0 0 50px;width:50px;height:50px;border-radius:50%;background:#f7edcf;color:#a8780d}.symbol svg{width:25px;height:25px}.words{min-width:0;flex:1;text-align:right}.name{display:block;font-size:19px;font-weight:900;line-height:1.45}.sub{display:block;font-size:13px;color:#7b7366;line-height:1.55;overflow-wrap:anywhere}.contact{margin:24px auto 0;max-width:720px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 24px;background:white;border:1px solid var(--line);border-radius:20px}.contact-info{text-align:right}.contact-label{font-size:17px;font-weight:800}.phone{font:900 25px Cairo,Tahoma,sans-serif;direction:ltr;unicode-bidi:isolate;display:block;letter-spacing:.2px}.copy{border:1px solid #bc8613;background:#fff;color:#a36f00;border-radius:99px;padding:10px 22px;font:800 15px Cairo,Tahoma,sans-serif;cursor:pointer;white-space:nowrap}.copy:hover{background:#f7edcf}.address{margin:19px auto 0;text-align:center;font-size:17px;font-weight:800;line-height:1.8}.address svg{width:18px;height:18px;vertical-align:-4px;color:#a8780d;margin-left:7px}@media(max-width:550px){body{padding:30px 15px 42px}.logo{margin:5px auto 29px}.logo img{width:100%}.links{gap:11px}.tile{min-height:126px;padding:15px 10px;flex-direction:column;justify-content:center;gap:9px;border-radius:17px}.symbol{width:43px;height:43px;flex-basis:43px}.symbol svg{width:22px;height:22px}.words{text-align:center;flex:initial}.name{font-size:16px}.sub{font-size:11px}.contact{padding:17px 16px;gap:12px}.contact-label{font-size:15px}.phone{font-size:21px}.copy{padding:9px 16px;font-size:13px}.address{font-size:15px}}

/* Floating decorative ice creams, never covering buttons */
.float-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.page{position:relative;z-index:1}
.float-ice{position:absolute;width:clamp(42px,6vw,85px);height:auto;opacity:.65;filter:drop-shadow(0 8px 10px #b7954a24);animation:iceFloat 6s ease-in-out infinite alternate;transform-origin:center}
.float-ice:nth-child(1){top:20%;left:2%;animation-delay:-1s;rotate:-18deg}
.float-ice:nth-child(2){top:52%;right:2%;animation-delay:-3s;rotate:15deg;width:clamp(38px,5vw,70px)}
.float-ice:nth-child(3){bottom:5%;left:8%;animation-delay:-4s;rotate:18deg;width:clamp(34px,4vw,60px)}
@keyframes iceFloat{from{translate:0 -10px;rotate:-5deg}to{translate:0 14px;rotate:8deg}}
@media(max-width:900px){.float-ice{opacity:.26}.float-ice:nth-child(1){left:-20px}.float-ice:nth-child(2){right:-20px}.float-ice:nth-child(3){left:-12px}}
@media(prefers-reduced-motion:reduce){.float-ice{animation:none}}

<style>
/* Layout: one narrow column. Storefront photo fades into cream, logo sits over the fade, link rows stack below. */
:root {
  --cream: #FBF8F2;
  --card: #FFFFFF;
  --ink: #15130F;
  --muted: #6B6558;
  --gold: #D4A62A;
  --gold-deep: #A9780F;
  --line: #E9DFC6;
  --font: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 28px;
}
.wrap { max-width: 480px; margin: 0 auto; }

.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #efe9dd; }
.bg img {
  position: absolute; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px);
  object-fit: cover; object-position: 60% 35%;
  filter: blur(30px) saturate(1.1); transform: scale(1.08);
}
.bg::after { content: ""; position: absolute; inset: 0; background: rgba(251,248,242,.58); }

.brand { position: relative; margin-top: 0; padding-top: calc(48px + env(safe-area-inset-top, 0px)); text-align: center; padding-inline: 10px; }
.brand img { width: min(86%, 380px); height: auto; display: inline-block; }
.tagline {
  margin: 14px 0 0;
  font-size: 13px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase;
  color: var(--gold-deep);
}

.links { display: grid; gap: 12px; margin: 26px 0 0; padding: 0; list-style: none; }
.row {
  display: flex; align-items: center; gap: 14px;
  min-height: 72px; padding: 12px 14px;
  background: rgba(255,255,255,.86); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--ink); text-decoration: none;
  border: 1.5px solid var(--line); border-radius: 18px;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.row:hover { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 8px 22px -12px rgba(169,120,15,.55); }
.row:focus-visible, .copy:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; }
.row.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.row.primary .sub { color: #D9CFB5; }
.row.primary .ico { background: var(--gold); color: var(--ink); }
.ico {
  flex: none; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: #F6EBC8; color: var(--gold-deep);
}
.ico svg { width: 24px; height: 24px; display: block; }
.txt { flex: 1; min-width: 0; }
.name { display: block; font-size: 18px; font-weight: 700; line-height: 1.3; }
.sub { display: block; font-size: 14px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
.sub.ltr { direction: ltr; text-align: right; unicode-bidi: plaintext; }
.chev { flex: none; width: 20px; height: 20px; color: var(--gold-deep); }
.row.primary .chev { color: var(--gold); }

.call { cursor: default; }
.call:hover { transform: none; box-shadow: none; border-color: var(--line); }
.num { direction: ltr; display: block; text-align: right; font-size: 20px; font-weight: 900; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.copy {
  flex: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--gold-deep);
  background: transparent; color: var(--gold-deep);
}
.copy:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }

.foot { margin-top: 30px; text-align: center; color: var(--muted); font-size: 14px; }
.foot .addr { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 700; font-size: 15px; }
.foot .addr svg { width: 18px; height: 18px; color: var(--gold-deep); flex: none; }
.foot small { display: block; margin-top: 10px; font-size: 12px; letter-spacing: .08em; }
@media (prefers-reduced-motion: reduce) { .row { transition: none; } .row:hover { transform: none; } }

/* Floating ice-cream confetti — decorative only; original cards remain unchanged. */
.ice-rain{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:3;isolation:isolate}
.ice-rain .cone-fall{position:absolute;left:var(--x);top:-150px;width:var(--w);height:auto;opacity:var(--o);filter:drop-shadow(0 9px 8px rgba(80,51,12,.13));animation:ice-fall var(--dur) linear var(--delay) infinite;will-change:transform}
.ice-rain .cone-fall svg{display:block;width:100%;height:auto}
@keyframes ice-fall{
  0%{transform:translate3d(0,-160px,0) rotate(var(--r0))}
  25%{transform:translate3d(26px,calc(25vh + 30px),0) rotate(15deg)}
  50%{transform:translate3d(-20px,calc(50vh + 80px),0) rotate(-14deg)}
  75%{transform:translate3d(28px,calc(75vh + 130px),0) rotate(19deg)}
  100%{transform:translate3d(-18px,calc(100vh + 290px),0) rotate(var(--r1))}
}
@media(max-width:600px){.ice-rain .cone-fall:nth-child(n+10){display:none}.ice-rain .cone-fall{opacity:calc(var(--o) * .72)}}
@media(prefers-reduced-motion:reduce){.ice-rain{display:none}}
</style>
